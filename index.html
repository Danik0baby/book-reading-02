<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Book</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="viewer">
    <header class="viewer-header">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 6.5C9.8 4.8 6.7 4.4 3.5 5.2v13c3.2-.8 6.3-.4 8.5 1.3m0-13c2.2-1.7 5.3-2.1 8.5-1.3v13c-3.2-.8-6.3-.4-8.5 1.3m0-13v13"/></svg>
            </span>
            <span class="brand-copy">
                <span class="viewer-title">Читальный зал</span>
                <span class="viewer-subtitle">Цифровой флипбук</span>
            </span>
        </div>
        <span id="status">Загрузка книги…</span>
    </header>

    <main id="stage">
        <div id="book"></div>
        <div class="stage-hint" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8 12V6.5a1.5 1.5 0 0 1 3 0V11m0-.5V5.8a1.5 1.5 0 0 1 3 0V11m0-.3V7a1.5 1.5 0 0 1 3 0v5m0-.5a1.5 1.5 0 0 1 3 0v4.2a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.6-2.2L5 16a1.7 1.7 0 0 1 2.5-2.2L8 14"/></svg>
            Потяните за угол, чтобы перевернуть страницу
        </div>
    </main>

    <nav class="toolbar" aria-label="Управление книгой">
        <button id="first-page" type="button" title="Первая страница" aria-label="Первая страница"><svg viewBox="0 0 24 24"><path d="M5 5v14m14-12-7 5 7 5"/></svg></button>
        <button id="previous-page" type="button" title="Предыдущая страница" aria-label="Предыдущая страница"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
        <span id="counter" aria-live="polite"></span>
        <button id="next-page" type="button" title="Следующая страница" aria-label="Следующая страница"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
        <button id="last-page" type="button" title="Последняя страница" aria-label="Последняя страница"><svg viewBox="0 0 24 24"><path d="M19 5v14M5 7l7 5-7 5"/></svg></button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button id="zoom-out" type="button" title="Уменьшить" aria-label="Уменьшить"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4 4m-11-9h4"/></svg></button>
        <button id="zoom-in" type="button" title="Увеличить" aria-label="Увеличить"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4 4m-11-9h4m-2-2v4"/></svg></button>
        <button id="sound-toggle" type="button" title="Выключить звук" aria-label="Выключить звук" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4m12-1a5 5 0 0 1 0 6m2-9a9 9 0 0 1 0 12"/></svg></button>
        <button id="fullscreen" type="button" title="На весь экран" aria-label="На весь экран"><svg viewBox="0 0 24 24"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg></button>
    </nav>
</div>
<script src="./js/page-flip.browser.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
